<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>8 times 8</title>
  <meta name="theme-color" content="#e4e4e2">
  <script>
    // Set the theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = (JSON.parse(localStorage.getItem('8times8.v1') || 'null') || {}).theme; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <canvas id="board" aria-label="盤面"></canvas>

  <div class="status">
    <div class="status-top">
      <div id="points" class="points" aria-live="polite">0A</div>
      <span id="item-icon" class="item-icon" hidden title="タイルを押したままなぞると、めくれます"></span>
    </div>
    <button id="btn-shop" class="upgrade" type="button" aria-expanded="false" aria-controls="shop">強化・機械</button>
  </div>

  <div id="shop" class="shop" hidden></div>

  <div class="debug-tools">
    <button id="btn-debug" class="reset" type="button" aria-expanded="false" aria-controls="debug-panel">デバッグ</button>
  </div>
  <div id="debug-panel" class="debug-panel" hidden></div>

  <div class="controls">
    <button id="btn-sound" class="btn" type="button" title="効果音 オン/オフ" aria-label="効果音 オン/オフ" aria-pressed="true">
      <svg viewBox="0 0 24 24" class="ico ico-on"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5" class="line"/><path d="M18.5 7a7 7 0 0 1 0 10" class="line"/></svg>
      <svg viewBox="0 0 24 24" class="ico ico-off"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" class="line"/></svg>
    </button>
    <button id="btn-theme" class="btn" type="button" title="ダークモード オン/オフ" aria-label="ダークモード オン/オフ" aria-pressed="false">
      <svg viewBox="0 0 24 24" class="ico ico-moon"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg>
      <svg viewBox="0 0 24 24" class="ico ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" class="line"/></svg>
    </button>
    <button id="btn-zoom-out" class="btn" type="button" title="縮小" aria-label="縮小">
      <svg viewBox="0 0 24 24" class="ico"><path d="M6 12h12" class="line"/></svg>
    </button>
    <button id="btn-zoom-in" class="btn" type="button" title="拡大" aria-label="拡大">
      <svg viewBox="0 0 24 24" class="ico"><path d="M6 12h12M12 6v12" class="line"/></svg>
    </button>
    <button id="btn-home" class="btn" type="button" title="開始位置へ戻る" aria-label="開始位置へ戻る">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="6.5" class="line"/><circle cx="12" cy="12" r="2"/></svg>
    </button>
  </div>

  <div id="hint" class="hint" hidden>
    <span class="hint-pc">クリックで返す　／　背景をドラッグで移動　／　ホイールで拡大縮小</span>
    <span class="hint-touch">タップで返す　／　背景をドラッグで移動・2本指で拡大縮小</span>
  </div>

  <script src="main.js?v=29"></script>
</body>
</html>
