version: 2
project_name: 8times8

builds:
  - builder: rust
    binary: 8times8
    tool: cargo
    command: build
    targets: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu]
    flags: [--release, --locked]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSES/Cantarell-OFL-1.1.txt]
