version: 2
project_name: 8times8

builds:
  - id: linux
    builder: rust
    binary: 8times8
    tool: cargo
    command: build
    targets: [x86_64-unknown-linux-gnu]
    flags: [--release, --locked]
  - id: windows
    builder: rust
    binary: 8times8
    tool: cargo
    command: build
    targets: [x86_64-pc-windows-gnu]
    flags: [--release, --locked]

archives:
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    files:
      - README.md
      - LICENSES/Cantarell-OFL-1.1.txt
      - src: assets/8times8.desktop
        dst: share/applications/8times8.desktop
      - src: vendor/build/icon.png
        dst: share/icons/hicolor/256x256/apps/8times8.png
  - id: windows
    ids: [windows]
    formats: [zip]
    files: [README.md, LICENSES/Cantarell-OFL-1.1.txt]
